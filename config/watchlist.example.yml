# huntley — company and fund watchlist.
#
# Which companies and funds to check every morning through their own job boards.
# Matching roles from companies you named earn a score bonus
# (rank.watchlist_bonus in huntley.yml, default +0.5).
#
# Copy to config/watchlist.yml (`huntley setup` does this). Nothing here exempts
# a role from your title, location or company rules — those live in
# config/preferences.yml and apply to every role.
#
#   tracked_companies  companies you care about (bonus + digest badge)
#   portfolio_boards   VC talent-network boards (Getro / Consider); no bonus
#   fund_portfolios    VC funds without such a board; companies resolved and
#                      scanned every run; no bonus
#
# Adding companies the easy way:
#
#   node bin/huntley.mjs discover-board "Company Name" --summary
#
# probes the public job-board APIs, reports which board each company uses, and
# prints entries ready to paste. Add --write to append them for you.

# ── Companies you named ─────────────────────────────────────────────
#
# Fields per entry:
#   name          required — display name and watchlist-bonus key
#   careers_url   required — the ATS board URL, not the marketing careers page
#   provider      optional — ashby | greenhouse | lever | gem | … (discover-ats
#                 usually fills this in; leave blank to auto-detect)
#   api           optional — Greenhouse JSON API URL when the board needs it
#   enabled       default true — set false to keep the entry without scanning

tracked_companies:

  - name: "Example Company"
    careers_url: "https://jobs.ashbyhq.com/example"
    provider: ashby
    enabled: true

  # Greenhouse boards often include an `api` URL from discover-ats:
  # - name: "Example Greenhouse Co"
  #   careers_url: "https://job-boards.greenhouse.io/example"
  #   api: "https://boards-api.greenhouse.io/v1/boards/example/jobs"
  #   provider: greenhouse
  #   enabled: true

# ── VC talent-network boards ────────────────────────────────────────
#
# A fund's aggregated job board across its whole portfolio — a cheap way to
# reach hundreds of startups you have never named. Matching roles get no
# watchlist bonus; your title and location rules still apply.
#
# Getro boards need only careers_url (+ provider: getro).
# Consider boards also need consider_board (the board slug).
# getro_max_age_days bounds pagination — this is a daily digest, so paging
# months of stale postings buys nothing (default if omitted: provider default).

portfolio_boards:

