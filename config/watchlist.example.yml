# ── Scanner-specific settings ───────────────────────────────────────
#
# Titles, keywords and locations do NOT belong here — see preferences.yml.
# Only settings with no huntley equivalent pass through to career-ops.

# Let a posting become eligible again if it is republished at the same URL
# after this many days. Without it, a URL is deduplicated forever.
scan_history:
  recheck_after_days: 60

# ── Fund portfolios (no Getro / Consider board) ─────────────────────
#
# huntley lists each fund's companies, finds each company's job board from its
# own website, and scans those boards every run. Roles here earn no bonus.
#
# `kind` is the shape of the fund's public page:
#   yc             YC's company directory (hiring companies only); no url needed
#   ats_links      a page linking to job boards or postings on them
#   company_links  a portfolio page linking to company websites
#   wordpress      a WordPress portfolio post type (…/wp-json/wp/v2/<type>)
#
# Fields: name, kind, url (required except for yc), enabled (default true).

fund_portfolios:

  - name: "Y Combinator"
    kind: yc
    enabled: true

  - name: "South Park Commons"
    kind: ats_links
    url: "https://www.southparkcommons.com/jobs"
    enabled: true

  - name: "Greylock"
    kind: ats_links
    url: "https://greylock.com/jobs/portfolio-jobs/"
    enabled: true

  - name: "Pear VC"
    kind: wordpress
    url: "https://pear.vc/wp-json/wp/v2/pear_vc_company"
    enabled: true

  - name: "Work-Bench"
    kind: company_links
    url: "https://www.work-bench.com/portfolio"
    enabled: true

  - name: "Mythos Ventures"
    kind: company_links
    url: "https://www.mythos.vc/portfolio"
    enabled: true
